[package]
name = "north-vector-desktop"
version = "0.1.0"
description = "North Vector — native macOS wrapper around the deployed web app"
edition = "2021"

# See https://tauri.app/develop/#understanding-the-src-tauri-directory
[lib]
name = "north_vector_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
